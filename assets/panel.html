<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>肥鱼账单</title>
<style>
:root{--bg:#0f1117;--card:#181b23;--line:#262b36;--txt:#e8eaf0;--dim:#8b93a7;--accent:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:34px 20px 60px;color:var(--txt);
  background:radial-gradient(1100px 560px at 72% -8%,#1c2636,#0f1117 62%);
  font:14px/1.65 "Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.head .ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(180deg,#1e3a5f,#16283d);border:1px solid #2b4a6f}
h1{font-size:19px;margin:0}
.sub{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 16px}
.card{background:linear-gradient(180deg,#1a1e28,#161922);border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.k{color:var(--dim);font-size:12px;margin-bottom:5px}
.v{font-size:25px;font-weight:600;letter-spacing:.5px}
.v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:3px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}
.chart div{flex:1;background:linear-gradient(180deg,#38bdf8,#1d4ed8);border-radius:4px 4px 2px 2px;min-height:2px;position:relative}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:#5f6779}
.feed{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 18px;border-radius:999px;
  font-size:14px;text-decoration:none;color:#fde68a;background:linear-gradient(180deg,#3a2b12,#2a1f0d);border:1px solid #6b4f1d}
.feed:hover{border-color:#a97c26;color:#fef3c7}
.muted{color:var(--dim);font-size:12px}
.tip{margin-top:14px;padding:11px 13px;border-radius:12px;background:#1b1f2a;border:1px solid #26303f;color:#cfd6e6;font-size:13px}
</style></head><body><div class="wrap">
<div class="head">
  <div class="ava">🐟</div>
  <div>
    <h1>大肥鱼账单</h1>
    <div class="sub" id="sub">正在读账…</div>
  </div>
</div>

<div class="grid">
  <div class="card"><div class="k">当前余额</div><div class="v" id="balance">—<small>元</small></div></div>
  <div class="card"><div class="k">今天她花了</div><div class="v" id="today">—<small>元</small></div></div>
  <div class="card"><div class="k">本周</div><div class="v" id="week">—<small>元</small></div></div>
  <div class="card"><div class="k">本月</div><div class="v" id="month">—<small>元</small></div></div>
</div>

<div class="card">
  <div class="k">最近 14 天她花了多少</div>
  <div class="chart" id="chart"></div>
</div>

<div class="card" style="margin-top:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div>
      <div class="k">累计（从开始记账到现在）</div>
      <div class="v" id="total">—<small>元</small></div>
    </div>
    <a class="feed" id="feed" href="https://platform.deepseek.com/top_up" target="_blank" rel="noopener">🐟 投喂大肥鱼</a>
  </div>
  <div class="tip" id="tip">每 30 分钟看一次余额，余额掉多少就是她花了多少。</div>
  <div style="margin-top:12px"><button id="snap">现在看一次</button> <span class="muted" id="msg"></span></div>
</div>
</div>
<script>
function el(id){ return document.getElementById(id) }
function money(n){ return (Math.round(n*100)/100).toFixed(2) }
function paint(d){
  el('sub').textContent = d.updatedAt
    ? ('上次更新 ' + new Date(d.updatedAt).toLocaleString('zh-CN', { hour12: false }) + ' · 共 ' + d.snaps + ' 次快照')
    : '还没开始攒数据';
  el('balance').innerHTML = (d.balance == null ? '—' : money(d.balance)) + '<small>元</small>';
  el('today').innerHTML = money(d.today) + '<small>元</small>';
  el('week').innerHTML = money(d.week) + '<small>元</small>';
  el('month').innerHTML = money(d.month) + '<small>元</small>';
  el('total').innerHTML = money(d.total) + '<small>元</small>';
  if (d.feedUrl) el('feed').href = d.feedUrl;
  if (d.note) el('tip').textContent = d.note;
  var ch = el('chart'); ch.innerHTML = '';
  var peak = 1;
  d.series.forEach(function(p){ if (p.amount > peak) peak = p.amount });
  d.series.forEach(function(p){
    var b = document.createElement('div');
    b.style.height = Math.max(2, Math.round(p.amount / peak * 92)) + '%';
    b.title = p.day + '  ' + money(p.amount) + ' 元';
    b.innerHTML = '<span>' + p.day + '</span>';
    ch.appendChild(b);
  });
}
function load(){
  fetch('/dsh-fish-bill/api/summary').then(function(r){ return r.json() }).then(paint).catch(function(e){
    el('sub').textContent = '读账失败：' + e;
  });
}
el('snap').addEventListener('click', function(){
  el('msg').textContent = '看一次…';
  fetch('/dsh-fish-bill/api/snap', { method:'POST' }).then(function(r){ return r.json() }).then(function(d){
    if (d.ok){ el('msg').textContent = '记下了'; paint(d) } else { el('msg').textContent = d.error || '失败' }
  }).catch(function(e){ el('msg').textContent = '出错了：' + e });
});
load();
</script></body></html>
